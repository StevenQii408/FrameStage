name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STORYBOARD_PROVIDER: mock
  STORYBOARD_BAILIAN_API_KEY: ''
  DASHSCOPE_API_KEY: ''
  STORYBOARD_ENV_FILE: /tmp/framestage-ci-private.env

jobs:
  release-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/release_source.py --verify-head
      - run: python3 scripts/secret_scan.py --history
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install media tools
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # Hosted runners can stall resolving their regional Ubuntu mirror.
            sources="$RUNNER_TEMP/framestage-media.list"
            options=(-o "Dir::Etc::sourcelist=$sources" -o "Dir::Etc::sourceparts=-" -o Acquire::Retries=0 -o Acquire::https::Timeout=15)
            for mirror in https://archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu; do
              for suite in noble noble-updates noble-security; do
                echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] $mirror $suite main universe"
              done > "$sources"
              if sudo apt-get "${options[@]}" update --error-on=any && sudo apt-get "${options[@]}" install -y --no-install-recommends ffmpeg; then
                break
              fi
            done
          fi
          ffmpeg -version
          ffprobe -version
      - name: Install locked backend
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Check installed distribution contents
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/framestage-wheel" .
          python ../scripts/check_backend_wheel.py "$RUNNER_TEMP"/framestage-wheel/*.whl
      - name: Test without cloud credentials
        run: python -m pytest -q -p no:cacheprovider
      - name: Check authored style artifact
        run: python -m app.style_library check

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:layout
      - run: npm run build
      - name: Check known high-severity dependency advisories
        run: npm audit --audit-level=high
