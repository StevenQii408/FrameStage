[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-storyboard-backend"
version = "0.1.0"
description = "Local AI storyboard analysis backend"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1,<1",
  "uvicorn[standard]>=0.52.4,<1",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1,<2",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "psutil>=6,<7",
  "Pillow>=13,<14",
  "scenedetect>=0.6.7.1,<0.8",
  "opencv-python>=4.10,<6"
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*", "evals", "evals.*"]
namespaces = false

[tool.setuptools.package-data]
evals = ["*.json"]
"app.prompt_profiles" = ["*.json", "*.md"]
"app.style_vector" = ["*.json"]
"app.style_direct" = ["*.json"]
